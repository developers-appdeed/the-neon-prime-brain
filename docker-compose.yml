# Brain MCP server — the digital brain (graphify multi-graph knowledge query).
# Deployed via Coolify. Local dev: `docker compose up` from this dir.
# The coolify network is declared external so the service name "brain"
# resolves for other Coolify apps (e.g. fastify reaches it as http://brain:8000).
networks:
  coolify:
    external: true

services:
  brain:
    build: .
    networks:
      - coolify
    expose:
      - "8000"
    environment:
      BRAIN_HOST: "0.0.0.0"
      BRAIN_PORT: "8000"
      BRAIN_BEARER_TOKEN: "${BRAIN_BEARER_TOKEN}"
      BRAIN_MEMORY_DIR: "/graphs/memory"
      BRAIN_REPOS_FILE: "/graphs/repos.json"
    volumes:
      - ./data/repos:/repos
      - ./data/graphs:/graphs
    restart: unless-stopped

# Brain MCP server — the digital brain (graphify multi-graph knowledge query).
# Deployed via Coolify. Local dev: `docker compose up` from this dir.
services:
  brain:
    build: .
    # No host port mapping — Coolify itself uses host :8000.
    # The brain is reached on the coolify docker network as brain:8000.
    expose:
      - "8000"
    environment:
      BRAIN_HOST: "0.0.0.0"
      BRAIN_PORT: "8000"
      BRAIN_BEARER_TOKEN: "${BRAIN_BEARER_TOKEN}"
      BRAIN_MEMORY_DIR: "/graphs/memory"
      BRAIN_REPOS_FILE: "/graphs/repos.json"
    volumes:
      - ./data/repos:/repos
      - ./data/graphs:/graphs
    restart: unless-stopped
